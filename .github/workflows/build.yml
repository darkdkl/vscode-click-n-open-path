name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Package the extension
        run: npm run package

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          version=$(node -p "require('./package.json').version")
          file="click-n-open-path-$version.vsix"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to publish"
          else
            awk -v v="## $version" '$0 == v { found = 1; next } found && /^#/ { exit } found' CHANGELOG.md > notes.md
            gh release create "v$version" "$file" --title "$version" --notes-file notes.md --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
